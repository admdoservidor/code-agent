[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-agent"
version = "0.1.0"
description = "AI Coding Agent using LangChain and Groq"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-groq",
    "langgraph",
    "python-dotenv"
]

[tool.setuptools.packages.find]
where = ["src"]
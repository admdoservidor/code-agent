[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-agent"
version = "0.1.0"
description = "AI Coding Agent using LangChain and Groq"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-google-genai>=4.4.3",
    "langchain-groq",
    "langchain-nvidia-ai-endpoints>=1.5.0",
    "langgraph",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pytest>=9.2.0",
    "python-dotenv",
    "ruff>=0.17.4",
]

[tool.setuptools.packages.find]
where = ["src"]
